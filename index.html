<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Target Hisobot</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--ink:#14161a;--sub:#5d6470;--mut:#8b919c;--line:#e6e8ec;--soft:#f0f2f5;
  --acc:#0a7cff;--acc-ink:#fff;--accs:color-mix(in srgb,var(--acc) 12%,transparent);
  --good:#16a34a;--warn:#d98a00;--bad:#e0413a;--bar:#d5d9e0;
  --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --r:16px;color-scheme:light
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1114;--card:#181b20;--ink:#eef0f3;--sub:#a7adb7;--mut:#7c838e;--line:#272b32;--soft:#20242a;
  --good:#3ccf74;--warn:#f2b230;--bad:#ff6b62;--bar:#3a3f48;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1114;--card:#181b20;--ink:#eef0f3;--sub:#a7adb7;--mut:#7c838e;--line:#272b32;--soft:#20242a;
  --good:#3ccf74;--warn:#f2b230;--bad:#ff6b62;--bar:#3a3f48;--sh:none;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--acc)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* --- login --- */
#login{min-height:100vh;display:grid;place-items:center;padding-block:32px}
.lbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--sh)}
.logo{width:40px;height:40px;border-radius:12px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.lbox h1{font-size:22px;margin:16px 0 2px;letter-spacing:-.01em}
.lbox p{margin:0 0 20px;color:var(--sub);font-size:14px}
.fld{display:grid;gap:6px;margin-bottom:12px}
.fld label{font-size:13px;color:var(--sub);font-weight:600}
.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 12px;outline:none}
.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
.btn{border:0;background:var(--acc);color:var(--acc-ink);border-radius:11px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.w{width:100%;padding:12px}
.btn.g{background:var(--soft);color:var(--ink)}
.btn.s{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.d{background:transparent;color:var(--bad);border:1px solid var(--line)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:4px 0 8px}
.hint{margin-top:16px;padding:10px 12px;border-radius:11px;background:var(--soft);font-size:13px;color:var(--sub)}
.hint b{color:var(--ink)}
.lnk{display:block;text-align:center;margin-top:14px;font-size:14px;font-weight:600;text-decoration:none}

/* --- shell --- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.bar1{display:flex;align-items:center;gap:12px;padding-block:12px}
.bname{font-weight:800;font-size:16px;line-height:1.15}
.bname small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.chip{font-size:11px;font-weight:800;letter-spacing:.06em;padding:3px 8px;border-radius:99px;background:var(--accs);color:var(--acc)}
.sp{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{white-space:nowrap;text-decoration:none;color:var(--sub);font-weight:700;font-size:14px;padding:7px 13px;border-radius:99px}
.tabs a.on{background:var(--ink);color:var(--bg)}
.tabs a.pitch{color:var(--acc)}
.tabs a.pitch.on{background:var(--acc);color:var(--acc-ink)}
.pbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 0 16px}
.pbar h2{margin:0;font-size:24px;letter-spacing:-.02em;flex:1;min-width:200px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:none;padding:6px 11px;border-radius:9px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg)}
main{padding-bottom:60px}

/* --- cards --- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);min-width:0}
.card h3{margin:0 0 4px;font-size:16px;letter-spacing:-.01em}
.card .cap{color:var(--mut);font-size:13px;margin:0 0 14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
@media (max-width:520px){.kpi .v{font-size:22px}.bname small,#whoami{display:none}.hero .big .k{font-size:12px}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;box-shadow:var(--sh);min-width:0}
.kpi .k{font-size:12.5px;color:var(--sub);font-weight:600;display:flex;gap:6px;align-items:center}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:4px;line-height:1.15}
.kpi .d{font-size:12.5px;font-weight:700;margin-top:4px}
.up{color:var(--good)}.dn{color:var(--bad)}.fl{color:var(--mut)}
.tagc{font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--soft);color:var(--mut)}
.mt{margin-top:14px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(220px,280px) 1fr;gap:24px;align-items:center}
.hero .big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.hero .big .v{font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.hero .big .k{font-size:13px;color:var(--sub);font-weight:600}
.verdict{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:6px 12px;border-radius:99px;background:var(--soft);margin-bottom:14px}
.verdict i{width:8px;height:8px;border-radius:50%;display:block}
.speedo svg{display:block;width:100%;height:auto;overflow:visible}
.speedo text{font-family:inherit}
.ndl{transform-origin:140px 140px;transform:rotate(var(--a));animation:ndl 1.1s cubic-bezier(.2,1.35,.4,1) both}
@keyframes ndl{from{transform:rotate(-90deg)}}
@media (max-width:680px){.hero{grid-template-columns:1fr}.hero .speedo{max-width:280px;margin:0 auto;width:100%}}

/* charts */
.chart{width:100%;overflow:hidden}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-size:11px;fill:var(--mut);font-family:inherit}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}
.legend b{width:10px;height:10px;border-radius:3px;display:block}
.funnel{display:grid;gap:10px}
.frow{display:grid;grid-template-columns:120px 1fr 110px;gap:10px;align-items:center;font-size:14px}
.frow .t{color:var(--sub);font-weight:600}
.frow .b{height:30px;background:var(--soft);border-radius:8px;overflow:hidden}
.frow .b i{display:block;height:100%;border-radius:8px;background:var(--acc);transition:width .6s}
.frow .n{text-align:right;font-weight:800}
.frow .n small{display:block;font-weight:600;color:var(--mut);font-size:11.5px}
@media (max-width:520px){.frow{grid-template-columns:92px 1fr 78px}}
.hb{display:grid;gap:9px}
.hbr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13.5px}
.hbr .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbr .n{font-weight:700}
.hbr .b{grid-column:1/-1;height:7px;background:var(--soft);border-radius:9px;overflow:hidden}
.hbr .b i{display:block;height:100%;background:var(--acc);border-radius:9px}

/* tables */
.tw{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
tr.sub td{background:var(--soft);font-size:12.5px;color:var(--sub)}
tr.sub td:first-child{padding-left:26px}
.pill{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.p-warn{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}
.p-bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.p-acc{background:var(--accs);color:var(--acc)}
.p-mut{background:var(--soft);color:var(--sub)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters .in{width:auto;flex:1;min-width:150px;padding:8px 11px}
.note{font-size:13px;color:var(--sub);background:var(--soft);border-radius:12px;padding:12px 14px}
.note b{color:var(--ink)}

/* settings */
.set{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));align-items:start}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.mlist{display:grid;gap:6px}
.mi{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;font-size:14px}
.mi.off{opacity:.55}
.mi .t{flex:1;min-width:0}
.mi .t small{display:block;color:var(--mut);font-size:12px}
.ib{border:0;background:var(--soft);border-radius:8px;width:28px;height:28px;cursor:pointer;color:var(--sub);flex:none}
.ib:disabled{opacity:.35;cursor:default}
.sw{position:relative;width:38px;height:22px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--bar);border-radius:99px;cursor:pointer;transition:.2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span::after{transform:translateX(16px)}
.vars{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.vars button{border:1px dashed var(--line);background:none;border-radius:8px;padding:3px 8px;font-size:12.5px;cursor:pointer;color:var(--sub)}
.ok{color:var(--good);font-size:13px;min-height:18px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;border:2px solid var(--card);outline:2px solid transparent;cursor:pointer}
.colors button.on{outline-color:var(--ink)}

/* pitch */
.pitch section{padding-block:34px;border-bottom:1px solid var(--line)}
.pitch section:last-child{border-bottom:0}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--acc);text-transform:uppercase}
.pitch h2{font-size:clamp(28px,4.6vw,48px);line-height:1.06;letter-spacing:-.035em;margin:10px 0 14px;text-wrap:balance;max-width:18ch}
.pitch h3{font-size:clamp(22px,3vw,30px);letter-spacing:-.025em;margin:8px 0 16px;text-wrap:balance}
.pitch .lead{font-size:17px;color:var(--sub);max-width:60ch;margin:0}
.pcards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.pc .ic{font-size:13px;font-weight:800;color:var(--acc);margin-bottom:8px}
.pc b{display:block;font-size:16px;margin-bottom:4px}
.pc p{margin:0;color:var(--sub);font-size:14px}
.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.flow .st{flex:1;min-width:140px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.flow .st small{color:var(--mut);font-weight:700;font-size:11.5px}
.flow .st b{display:block;margin:2px 0}
.flow .st p{margin:0;font-size:13px;color:var(--sub)}
.flow .ar{display:grid;place-items:center;color:var(--mut);font-weight:800}
@media (max-width:640px){.flow{flex-direction:column}.flow .ar{transform:rotate(90deg);height:14px}}
.case{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.case>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.case .v{font-size:30px;font-weight:800;letter-spacing:-.03em}
.case .k{color:var(--sub);font-size:13px}
.pack{background:var(--ink);color:var(--bg);border-radius:22px;padding:26px;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.pack ul{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.pack li{display:flex;gap:10px;font-size:15px}
.pack li::before{content:"✓";color:var(--acc);font-weight:800}
.pack .price{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.03em}
.pack .btn{display:inline-block;text-decoration:none;margin-top:12px}
.pack .muted{opacity:.7;font-size:14px}
.toplink{display:flex;align-items:center;gap:10px;padding-block:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;flex:none;box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.livei{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--sub)}
@media (max-width:520px){.livei{display:none}}
.todayl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;font-size:13.5px;color:var(--sub)}
.todayl b{color:var(--ink)}
.noanim .ndl{animation:none}
.bump{animation:bump 1.6s ease-out}
@keyframes bump{0%{color:var(--good);text-shadow:0 0 12px color-mix(in srgb,var(--good) 45%,transparent)}100%{}}
#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:50;max-width:calc(100vw - 32px)}
.toast{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;box-shadow:0 8px 24px rgba(0,0,0,.14);font-size:14px;animation:tin .35s ease-out;transition:opacity .5s,transform .5s}
.toast small{display:block;color:var(--sub);font-size:12.5px}
.toast.out{opacity:0;transform:translateY(8px)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}}
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);align-self:start;display:grid;gap:3px;padding-top:20px}
.side a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--sub);font-weight:700;font-size:14.5px;text-decoration:none;border:1px solid transparent}
.side a:hover{background:var(--soft)}
.side a.on{background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:var(--sh)}
.side a.on .ic{color:var(--acc)}
.side a.pitch{margin-top:10px;color:var(--acc)}
.mbtn{display:none;border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px;place-items:center;cursor:pointer;color:var(--ink);flex:none}
@media (max-width:900px){.shell{grid-template-columns:1fr;gap:0}.mbtn{display:grid}
 .side{display:none;position:static;padding-top:12px}.menu .side{display:grid}}
.setw{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.smenu{display:grid;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px;box-shadow:var(--sh)}
.smenu button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:none;padding:10px 11px;border-radius:10px;font-weight:700;font-size:14px;color:var(--sub);cursor:pointer}
.smenu button.on{background:var(--soft);color:var(--ink)}.smenu button.on .ic{color:var(--acc)}
.sbody{min-width:0}
@media (max-width:760px){.setw{grid-template-columns:1fr}}
.integ{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.itile{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.itile .t{flex:1;min-width:0}.itile small{display:block;color:var(--mut);font-size:12.5px;line-height:1.35}
.ilogo{position:relative;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.ilogo img{position:absolute;inset:6px;width:32px;height:32px;object-fit:contain}
.qdef{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:center}
@media (max-width:760px){.qdef{grid-template-columns:1fr}}
.qchk{display:grid;gap:8px}.qchk span{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}.qchk .ic{color:var(--good);flex:none}
.mbar{height:7px;background:var(--soft);border-radius:9px;overflow:hidden;margin-bottom:3px}.mbar i{display:block;height:100%;background:var(--good);border-radius:9px}
.pbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.steps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.steps div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.steps .sn{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-weight:800;margin-bottom:10px}
.steps b{font-size:17px}.steps p{margin:4px 0 0;color:var(--sub);font-size:14.5px}
.ba{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.ba>div{border-radius:16px;padding:18px;display:grid;gap:10px}
.ba b{font-size:17px}.ba span{display:flex;gap:9px;align-items:flex-start;font-size:14.5px}.ba .ic{flex:none;margin-top:2px}
.bef{background:var(--soft)}.bef .ic{color:var(--bad)}
.aft{background:color-mix(in srgb,var(--good) 10%,var(--card));border:1px solid color-mix(in srgb,var(--good) 30%,transparent)}.aft .ic{color:var(--good)}
.foot{color:var(--mut);font-size:12.5px;text-align:center;padding-block:24px}
</style>
</head>
<body>

<div id="login" hidden>
  <form class="lbox" id="lform" autocomplete="on">
    <div class="logo" id="llogo">i</div>
    <h1 id="lbrand">Hisobot</h1>
    <p>Reklama va sotuv hisobotiga kirish</p>
    <div class="fld"><label for="lu">Login</label><input class="in" id="lu" autocomplete="username" required></div>
    <div class="fld"><label for="lp">Parol</label><input class="in" id="lp" type="password" autocomplete="current-password" required></div>
    <div class="err" id="lerr"></div>
    <button class="btn w" type="submit">Kirish</button>
    <div class="hint" id="lhint"></div>
    <a class="lnk" href="#taqdimot">Bu tizim nima beradi? →</a>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
